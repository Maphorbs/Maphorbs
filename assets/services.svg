<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="What I do" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1000" height="470" fill="#2b3bff"/>
<text x="36" y="58" font-family="Arial Black,Impact,sans-serif" font-size="40" fill="#fff" letter-spacing="-1">What I do</text>
<rect x="44" y="98" width="300" height="165" rx="16" fill="#111"/><rect x="36" y="90" width="300" height="165" rx="16" fill="#ffd23f" stroke="#111" stroke-width="4"/>
<text x="56" y="138" font-family="Arial Black,Impact,sans-serif" font-size="20" fill="#111">Full-stack engineering</text>
<text x="56" y="178" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">End-to-end apps connecting</text>
<text x="56" y="204" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">interfaces to robust services.</text>
<rect x="366" y="98" width="300" height="165" rx="16" fill="#111"/><rect x="358" y="90" width="300" height="165" rx="16" fill="#3ddc97" stroke="#111" stroke-width="4"/>
<text x="378" y="138" font-family="Arial Black,Impact,sans-serif" font-size="20" fill="#111">Mobile engineering</text>
<text x="378" y="178" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">Cross-platform apps, backend</text>
<text x="378" y="204" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">integration, release workflows.</text>
<rect x="688" y="98" width="300" height="165" rx="16" fill="#111"/><rect x="680" y="90" width="300" height="165" rx="16" fill="#ff4b6e" stroke="#111" stroke-width="4"/>
<text x="700" y="138" font-family="Arial Black,Impact,sans-serif" font-size="20" fill="#fff">Backend and APIs</text>
<text x="700" y="178" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#fff">REST APIs, auth flows, data</text>
<text x="700" y="204" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#fff">models, maintainable services.</text>
<rect x="44" y="283" width="300" height="165" rx="16" fill="#111"/><rect x="36" y="275" width="300" height="165" rx="16" fill="#f3eee2" stroke="#111" stroke-width="4"/>
<text x="56" y="323" font-family="Arial Black,Impact,sans-serif" font-size="20" fill="#111">Cloud and DevOps</text>
<text x="56" y="363" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">Docker, CI/CD, cloud, Linux</text>
<text x="56" y="389" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">servers, production support.</text>
<rect x="366" y="283" width="300" height="165" rx="16" fill="#111"/><rect x="358" y="275" width="300" height="165" rx="16" fill="#ffd23f" stroke="#111" stroke-width="4"/>
<text x="378" y="323" font-family="Arial Black,Impact,sans-serif" font-size="20" fill="#111">Product engineering</text>
<text x="378" y="363" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">Requirements to technical plans,</text>
<text x="378" y="389" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">trade-offs, shipped features.</text>
<rect x="688" y="283" width="300" height="165" rx="16" fill="#111"/><rect x="680" y="275" width="300" height="165" rx="16" fill="#3ddc97" stroke="#111" stroke-width="4"/>
<text x="700" y="323" font-family="Arial Black,Impact,sans-serif" font-size="20" fill="#111">Integrations and automation</text>
<text x="700" y="363" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">Payments, notifications, AI</text>
<text x="700" y="389" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111">and APIs wired together.</text>
</svg>